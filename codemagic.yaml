workflows:
  android-debug:
    name: Verificar Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Instalar Gradle
        script: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Comprobar compilacion
        script: |
          /tmp/gradle-8.13/bin/gradle --no-daemon :app:assembleDebug :app:lintDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release:
    name: Generar AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Instalar Gradle
        script: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Compilar AAB
        script: |
          /tmp/gradle-8.13/bin/gradle --no-daemon :app:bundleRelease -PproductionAds=true
    artifacts:
      - app/build/outputs/bundle/release/*.aab
